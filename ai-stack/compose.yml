services:
  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:unified-vulkan
    container_name: llama-swap
    restart: unless-stopped
    environment:
      - 'LLAMA_SWAP_API_KEY=${LLAMA_SWAP_API_KEY}'
    security_opt:
      - seccomp:unconfined
      - no-new-privileges:true
    labels:
      - "traefik.http.routers.llama-swap.rule=Host(`api.ai.mdelponte.com`)" 
      - "traefik.http.routers.llama-swap.entrypoints=websecure"
      - "traefik.http.routers.llama-swap.tls=true"
      - "traefik.http.routers.llama-swap.tls.certresolver=cloudflare"
      - "traefik.enable=true"
      - "traefik.http.routers.llama-swap.middlewares=lan-only@file"
      - "traefik.http.services.llama-swap.loadbalancer.server.port=8080"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    volumes:
      - /opt/models:/models
      - /srv/llama-swap/config.yaml:/etc/llama-swap/config/config.yaml:ro
    networks:
      - ainet
      - proxynet

  open-webui:
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui
    security_opt:
      - no-new-privileges:true
    volumes:
      - /srv/open-webui:/app/backend/data
    depends_on:
      - llama-swap
    #ports:
    #  - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      # Keep this value stable across container recreations so existing JWTs
      # and encrypted OAuth/MCP credentials remain valid.
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY must be set}"
      WEBUI_URL: "${WEBUI_URL:-https://ai.mdelponte.com}"
      WEBUI_SESSION_COOKIE_SECURE: "true"
      WEBUI_AUTH_COOKIE_SECURE: "true"
      ENABLE_SIGNUP: "false"
      JWT_EXPIRES_IN: "${WEBUI_JWT_EXPIRES_IN:-4w}"
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    labels:
      - "traefik.http.routers.open-webui.rule=Host(`ai.mdelponte.com`)" 
      - "traefik.http.routers.open-webui.entrypoints=websecure"
      - "traefik.http.routers.open-webui.tls=true"
      - "traefik.http.routers.open-webui.tls.certresolver=cloudflare"
      - "traefik.enable=true"
      - "traefik.http.routers.open-webui.middlewares=lan-only@file"
      - "traefik.http.services.open-webui.loadbalancer.server.port=8080"
    networks:
      - proxynet
      - ainet

  mcp-server:
    image: ghcr.io/madelponte/mcp-server:latest
    container_name: mcp-tools
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    env_file:
      - .env
    #ports:
    #  - "8000:8000"
    labels:
      - "traefik.http.routers.mcp.rule=Host(`mcp.mdelponte.com`)" 
      - "traefik.http.routers.mcp.entrypoints=websecure"
      - "traefik.http.routers.mcp.tls=true"
      - "traefik.http.routers.mcp.tls.certresolver=cloudflare"
      - "traefik.enable=true"
      - "traefik.http.routers.mcp.middlewares=lan-only@file"
      - "traefik.http.services.mcp.loadbalancer.server.port=8000"
    networks:
      - ainet
      - proxynet

  tika:
    image: apache/tika:latest-full
    container_name: tika
    security_opt:
      - no-new-privileges:true
    #ports:
    #  - "9998:9998"
    restart: unless-stopped
    networks:
      - ainet

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    security_opt:
      - no-new-privileges:true
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=America/New_York
    restart: unless-stopped
    networks:
      - ainet

networks:
  proxynet:
    external: true
    name: proxynet
  ainet:
    name: ainet
