global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true
  debug: false

entryPoints:
  web:
    address: :80
    http:
      # Drop non-standard aliasing header names (for example X_Auth_User)
      # before backends can normalize them into trusted canonical headers.
      aliasHeadersStrategy: delete
      redirections:
        entrypoint:
          to: websecure
          scheme: https

  websecure:
    address: :443
    http:
      aliasHeadersStrategy: delete
    transport:
      respondingTimeouts:
        readTimeout: 600s
        writeTimeout: 600s
        idleTimeout: 600s

certificatesResolvers:
  cloudflare:
    acme:
      email: madelponte@pm.me
      storage: /letsencrypt/acme.json
      keyType: EC256
      dnsChallenge:
        provider: cloudflare
        #disablePropagationCheck: true
        resolvers:
          - "192.168.2.1:53"
        propagation:
          delayBeforeChecks: 90

providers:
  docker:
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
    network: proxynet
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: "INFO"
  filePath: "/var/log/traefik/traefik.log"
accessLog:
  filePath: "/var/log/traefik/access.log"
