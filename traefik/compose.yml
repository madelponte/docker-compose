services:
  socket-proxy:
    image: ghcr.io/wollomatic/socket-proxy:1
    container_name: socket-proxy
    restart: unless-stopped
    user: "0:0"
    command:
      - '-listenip=0.0.0.0' # required: default is 127.0.0.1, i.e. unreachable
      - '-allowfrom=traefik' # client allowlist: nothing else, not even the host
      - '-allowGET=/(v1\.[0-9]{1,2}/)?(_ping|version|containers/json(\?.*)?|containers/[^/?]+/json(\?.*)?|events(\?.*)?)'
      - '-allowHEAD=/_ping' # required since Traefik >= 3.6.1 (API version probe)
      - '-loglevel=info' # logs the active allowlist at boot + every "blocked request"
      - '-watchdoginterval=3600' # exit if dockerd's socket inode goes stale, so
      - '-stoponwatchdog' # `restart` reopens it instead of Traefik silently aging out
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /run
    security_opt:
      - no-new-privileges:true

  traefik:
    image: dhi.io/traefik:3
    container_name: traefik
    restart: unless-stopped
    depends_on:
      - socket-proxy
    security_opt:
      - no-new-privileges:true
    environment:
      CF_DNS_API_TOKEN_FILE: /run/secrets/cf_dns_api_token
      CF_ZONE_API_TOKEN_FILE: /run/secrets/cf_zone_api_token
    labels:
      # Enable self‑routing
      - "traefik.enable=true"

      # Dashboard router
      - "traefik.http.routers.dashboard.rule=Host(`traefik.mdelponte.com`) || Host(`traefik2.mdelponte.com`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=cloudflare"
      - "traefik.http.routers.dashboard.tls.domains[0].main=mdelponte.com"
      - "traefik.http.routers.dashboard.tls.domains[0].sans=*.mdelponte.com"
      - "traefik.http.middlewares.homelab-auth.basicauth.usersfile=/run/secrets/basic_auth_users"
      # Authenticate at Traefik without passing shared credentials to backends.
      - "traefik.http.middlewares.homelab-auth.basicauth.removeheader=true"
      - "traefik.http.routers.dashboard.middlewares=lan-only@file,homelab-auth@docker"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /srv/traefik/letsencrypt:/letsencrypt
      - /srv/traefik/logs:/var/log/traefik
      - ./config:/etc/traefik:ro
    secrets:
      - cf_dns_api_token
      - cf_zone_api_token
      - basic_auth_users
    networks:
      - docker-api
      - arrs
      - ainet
      - immich
      - searxng
      - edge-bentopdf
      - edge-comfyui
      - edge-converter
      - edge-homeassistant
      - edge-jellyfin
      - edge-mealie
      - edge-unifi

# Traefik joins one network per backend stack (created by scripts/ensure-networks.sh)
# so backends can't reach each other. The same file runs on both hosts; networks
# for stacks that live on the other host are simply empty.
networks:
  arrs:
    external: true
    name: arrs
  ainet:
    external: true
    name: ainet
  immich:
    external: true
    name: immich
  searxng:
    external: true
    name: searxng
  speakr:
    external: true
    name: speakr
  edge-bentopdf:
    external: true
    name: edge-bentopdf
  edge-comfyui:
    external: true
    name: edge-comfyui
  edge-converter:
    external: true
    name: edge-converter
  edge-homeassistant:
    external: true
    name: edge-homeassistant
  edge-jellyfin:
    external: true
    name: edge-jellyfin
  edge-mealie:
    external: true
    name: edge-mealie
  edge-unifi:
    external: true
    name: edge-unifi
  docker-api:
    internal: true

secrets:
  basic_auth_users:
    file: /srv/traefik/secrets/basic_auth_users
  cf_dns_api_token:
    file: /srv/traefik/secrets/cf_dns_api_token
  cf_zone_api_token:
    file: /srv/traefik/secrets/cf_zone_api_token
