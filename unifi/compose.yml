services:
  unifi-network-application:
    image: lscr.io/linuxserver/unifi-network-application:latest
    container_name: unifi
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - MONGO_USER=unifi
      - MONGO_PASS=${MONGOPASS:?MONGOPASS must be set}
      - MONGO_HOST=unifi-db
      - MONGO_PORT=27017
      - MONGO_DBNAME=unifi
      - MONGO_AUTHSOURCE=admin
      - MEM_LIMIT=1024 #optional
      - MEM_STARTUP=1024 #optional
    volumes:
      - /srv/unifi/config:/config
    depends_on:
      unifi-db:
        condition: service_started
    ports:
      #- 8443:8443
      - 192.168.2.27:3478:3478/udp
      - 192.168.2.27:10001:10001/udp
      - 192.168.2.27:8080:8080
      - 192.168.2.27:1900:1900/udp #optional
      #- 8843:8843 #optional
      #- 8880:8880 #optional
      #- 6789:6789 #optional
      - 192.168.2.27:5514:5514/udp #optional
    restart: unless-stopped
    labels:
      - "traefik.http.routers.unifi.rule=Host(`unifi.mdelponte.com`)" 
      - "traefik.http.routers.unifi.entrypoints=websecure"
      - "traefik.http.services.unifi.loadbalancer.server.scheme=https"
      - "traefik.http.services.unifi.loadbalancer.serverstransport=unifi-insecure@file"
      - "traefik.http.routers.unifi.tls=true"
      - "traefik.http.routers.unifi.tls.certresolver=cloudflare"
      - "traefik.enable=true"
      - "traefik.http.routers.unifi.middlewares=lan-only@file"
      - "traefik.http.services.unifi.loadbalancer.server.port=8443"
    networks:
      - proxynet
      - unifi
  unifi-db:
    # The DHI runtime image does not run /docker-entrypoint-initdb.d scripts.
    # To initialize a new empty database, stop the stack, swap these image
    # lines, initialize with the official image, and then swap them back.
    image: dhi.io/mongodb:8.3.8
    # image: docker.io/mongo:8.3.8
    container_name: unifi-db
    command: ["--auth", "--bind_ip_all"]
    security_opt:
      - no-new-privileges:true
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${MONGOROOTPASS:?MONGOROOTPASS must be set}
      - MONGO_USER=unifi
      - MONGO_PASS=${MONGOPASS:?MONGOPASS must be set}
      - MONGO_DBNAME=unifi
      - MONGO_AUTHSOURCE=admin
    volumes:
      - /srv/unifi/db:/data/db
      - /srv/unifi/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    restart: unless-stopped
    networks:
      - unifi

networks:
  proxynet:
    external: true
    name: proxynet
  unifi:
    name: unifi
