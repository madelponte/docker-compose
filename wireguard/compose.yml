services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    # Host networking is required here so Traefik sees each VPN peer's real
    # 10.13.13.x source address. A bridged WireGuard container masquerades VPN
    # traffic behind a Docker gateway, which defeats Traefik's IP allowlist.
    # SECURITY: NET_ADMIN can modify the host firewall in this mode. Migrate
    # this service to OPNsense when practical; see OPNSENSE-MIGRATION.md.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - SERVERURL=mdelponte.duckdns.org
      - SERVERPORT=51820
      - PEERS=3
      - PEERDNS=192.168.2.1
      - INTERNAL_SUBNET=10.13.13.0
      - ALLOWEDIPS=192.168.2.0/24
    volumes:
      - /srv/wireguard:/config
      - /lib/modules:/lib/modules
    # No ports mapping is needed with host networking; WireGuard binds UDP
    # 51820 directly on the host. Docker cannot apply network sysctls to a
    # host-networked container. Server mode normally does not need
    # src_valid_mark; if startup logs require it, configure it on the host.
    restart: unless-stopped
